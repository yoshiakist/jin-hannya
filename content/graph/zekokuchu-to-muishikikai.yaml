id: zekokuchu-to-muishikikai
kind: phrase
label: 是故空中 / 無色無受想行識 / 無眼耳鼻舌身意 / 無色聲香味触法 / 無眼界乃至無意識界
reading: ぜこ くうちゅう むしき むじゅそうぎょうしき / むげんにびぜっしんに / むしきしょうこうみそくほう / むげんかい ないし むいしきかい
summary: それ故に空においては、人の心理作用も無い。身体の感覚器官や意識も無く、感覚の対象もまた無い。器官と対象が出会って生じる、識のはたらきの領域も無い。
parent: shingyo
children:
  - zeko-kuchu
  - mushiki-mujusogyoshiki
  - mu-genni-bizesshin-i
  - mu-shikisho-komisokuho
  - mu-genkai-naishi-muishikikai
layout: none
range: [82, 116]
