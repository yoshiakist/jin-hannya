id: shikihuiku-to-kusokuzeshiki
kind: phrase
label: 色不異空空不異色 / 色即是空空即是色
reading: しきふいくう くうふいしき / しきそくぜくう くうそくぜしき
summary: 色は空と異ならず、空は色と異ならない。色はすなわち空であり、空こそがまさに色である。
