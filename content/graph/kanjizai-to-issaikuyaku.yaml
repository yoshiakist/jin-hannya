id: kanjizai-to-issaikuyaku
kind: phrase
label: 観自在菩薩 / 行深般若波羅蜜多時 / 照見五蘊皆空 / 度一切苦厄
reading: かんじざいぼさつぎょうじんはんにゃはらみたじ / しょうけんごうんかいくうどいっさいくやく
summary: 観自在菩薩が深い智慧の実践のなかで、五つの構成要素がみな空であると見きわめ、あらゆる苦しみを超えた。
parent: shingyo
children: [kanjizai-bosatsu, gyojin-to-ji, shoken-to-kaiku, doissaikuyaku]
