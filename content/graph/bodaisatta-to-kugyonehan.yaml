id: bodaisatta-to-kugyonehan
kind: phrase
label: 菩提薩埵依般若波羅蜜多故 / 心無罣礙 / 無罣礙故無有恐怖 / 遠離一切顛倒夢想 / 究竟涅槃
reading: ぼだいさった え はんにゃはらみた こ / しん む けいげ / む けいげ こ む うくふ / おんり いっさい てんどう むそう / くきょう ねはん
summary: 求める者は深い智慧にを頼りにしていたため、心を覆い引っかけるものが無い。なので怖れも無く、あべこべの思いから遠く離れて、静けさの果てに至る。
parent: shingyo
layout: none
range: [149, 185]
